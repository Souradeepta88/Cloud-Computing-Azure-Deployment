name: CI/CD to AKS
on:
  push:
    branches: [main]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build and push image
        run: |
          IMG=${{ secrets.ACR_LOGIN_SERVER }}/taskapp:${{ github.sha }}
          docker build -t $IMG .
          docker push $IMG
      - uses: azure/setup-kubectl@v4
      - name: Deploy to AKS
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          sed -i "s#image: .*taskapp:.*#image: ${{ secrets.ACR_LOGIN_SERVER }}/taskapp:${{ github.sha }}#" k8s/deployment.yaml
          kubectl apply -f k8s/
          kubectl rollout status deployment/taskapp --timeout=180s
