services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: workdatabase1
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgresql
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workdatabase1"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_NAME: workdatabase1
      DB_USER: postgres
      DB_PASSWORD: postgresql
      SECRET_KEY: change-me-locally
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: